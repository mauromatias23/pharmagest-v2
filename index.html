
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <title>PharmaGest Angola</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif; 
        }
        #root {
            min-height: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        @media print {
            .no-print, aside, header, nav { 
                display: none !important; 
            }
            html, body, #root, #root > div, main, div {
                height: auto !important;
                min-height: 0 !important;
                max-height: none !important;
                overflow: visible !important;
                overflow-x: visible !important;
                overflow-y: visible !important;
            }
            html, body, #root, #root > div, main {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                display: block !important;
                position: static !important;
            }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-2xl {
                box-shadow: none !important;
            }
            .border { border-color: #cbd5e1 !important; }
            @page { 
                margin: 1.2cm 1cm 1.2cm 1cm; 
                size: A4 portrait; 
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                page-break-inside: auto !important;
                break-inside: auto !important;
            }
            thead {
                display: table-header-group !important;
            }
            tfoot {
                display: table-footer-group !important;
            }
            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: auto !important;
                break-after: auto !important;
            }
            .print-avoid-break {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }

        /* Scrollbar styling for a world-class look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
